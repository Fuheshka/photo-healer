[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-healer"
version = "0.2.0"
description = "Forensic repair tool for SSD TRIM-damaged photo archives"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fuheshka" }
]
dependencies = []

[project.scripts]
photo-healer = "photo_healer.cli.main:main"
photo-healer-gui = "photo_healer.gui.app:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
gui = [
    "PySide6>=6.5.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
